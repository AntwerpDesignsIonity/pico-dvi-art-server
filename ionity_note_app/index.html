<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ionity Note</title>
  <style>
    :root {
      --bg: #0a0c1a;
      --panel: #141830;
      --gold: #e0b254;
      --gold-dim: #8c6e34;
      --ink: #ecf0f8;
      --muted: #aab4d2;
      --blue: #245ac8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 500px at 20% -10%, #16204a 0%, transparent 60%),
        radial-gradient(900px 500px at 110% 110%, #1a1436 0%, transparent 60%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 24px;
      user-select: none;
    }
    .logo { width: 190px; margin-top: 6px; filter: drop-shadow(0 4px 18px rgba(224, 178, 84, .25)); }
    h1 {
      font-size: 20px;
      letter-spacing: 6px;
      font-weight: 600;
      color: var(--gold);
      margin: 18px 0 2px;
      text-transform: uppercase;
    }
    .sub { font-size: 11px; letter-spacing: 3px; color: var(--muted); margin-bottom: 26px; text-transform: uppercase; }
    .card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, rgba(224,178,84,.08), rgba(20,24,48,.9));
      border: 1px solid var(--gold-dim);
      border-radius: 10px;
      padding: 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    label { display: block; font-size: 10px; letter-spacing: 2px; color: var(--muted); margin: 0 0 6px 2px; text-transform: uppercase; }
    .hostrow { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] {
      width: 100%;
      background: #0d1024;
      border: 1px solid #2a3158;
      border-radius: 6px;
      color: var(--ink);
      font-size: 15px;
      padding: 11px 12px;
      outline: none;
      user-select: text;
    }
    input[type=text]:focus { border-color: var(--gold); }
    button {
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .scan {
      background: #1b2142;
      color: var(--muted);
      padding: 0 14px;
      font-size: 11px;
      white-space: nowrap;
    }
    .scan:hover { color: var(--gold); }
    .send {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      font-size: 15px;
      background: linear-gradient(180deg, #f0c86e, var(--gold));
      color: #1a1406;
      text-transform: uppercase;
    }
    .send:hover { filter: brightness(1.08); }
    .send:disabled { filter: grayscale(.8); cursor: wait; }
    .clear {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      font-size: 11px;
      background: transparent;
      border: 1px solid #2a3158;
      color: var(--muted);
      text-transform: uppercase;
    }
    .clear:hover { border-color: var(--gold-dim); color: var(--gold); }
    #status {
      margin-top: 16px;
      min-height: 18px;
      font-size: 12px;
      letter-spacing: 1px;
      text-align: center;
      color: var(--muted);
    }
    #status.ok { color: #7ed49a; }
    #status.err { color: #e07070; }
    .count { text-align: right; font-size: 10px; color: var(--muted); margin-top: 4px; }
    .footer { margin-top: auto; padding-top: 24px; font-size: 10px; letter-spacing: 2px; color: #3c4468; text-transform: uppercase; }
  </style>
</head>
<body>
  <img class="logo" src="assets/ionity-global.png" alt="Ionity Global Pty Ltd">
  <h1>Ionity Note</h1>
  <div class="sub">Scripture Display Note Board</div>

  <div class="card">
    <label for="host">Display address</label>
    <div class="hostrow">
      <input type="text" id="host" placeholder="192.168.124.10" spellcheck="false">
      <button class="scan" id="scan">FIND</button>
    </div>

    <label for="note">Note for the screen</label>
    <input type="text" id="note" maxlength="120" placeholder="Type a note..." spellcheck="false">
    <div class="count"><span id="chars">0</span>/120</div>

    <button class="send" id="send">Send to screen</button>
    <button class="clear" id="clearBtn">Clear the note</button>
    <button class="clear" id="fwBtn">Update device firmware (OTA)</button>
    <div id="status"></div>
    <div id="devinfo" style="margin-top:6px;font-size:10px;letter-spacing:1px;text-align:center;color:#5a6488;"></div>
  </div>

  <div class="footer">Ionity Global Pty Ltd &nbsp;|&nbsp; This PC: <span id="myip">...</span></div>

  <script>
    const host = document.getElementById("host");
    const note = document.getElementById("note");
    const send = document.getElementById("send");
    const clearBtn = document.getElementById("clearBtn");
    const scan = document.getElementById("scan");
    const status = document.getElementById("status");
    const chars = document.getElementById("chars");

    host.value = localStorage.getItem("ionity-host") || "";
    note.addEventListener("input", () => { chars.textContent = note.value.length; });

    function setStatus(text, cls) {
      status.textContent = text;
      status.className = cls || "";
    }

    async function push(text) {
      const target = host.value.trim();
      if (!target) { setStatus("ENTER OR FIND THE DISPLAY ADDRESS", "err"); return; }
      send.disabled = true;
      setStatus(text ? "SENDING..." : "CLEARING...");
      try {
        await window.ionity.pushNote(target, text);
        localStorage.setItem("ionity-host", target);
        setStatus(text ? "ON SCREEN - STAYS UNTIL CHANGED" : "NOTE CLEARED", "ok");
        if (text) note.select();
      } catch (err) {
        setStatus("COULD NOT REACH THE DISPLAY", "err");
      }
      send.disabled = false;
    }

    send.addEventListener("click", () => push(note.value.trim()));
    clearBtn.addEventListener("click", () => { note.value = ""; chars.textContent = "0"; push(""); });
    note.addEventListener("keydown", (e) => { if (e.key === "Enter") push(note.value.trim()); });

    scan.addEventListener("click", async () => {
      setStatus("SCANNING THE NETWORK...");
      scan.disabled = true;
      try {
        const found = await window.ionity.findDisplay();
        if (found) {
          host.value = found;
          localStorage.setItem("ionity-host", found);
          setStatus("DISPLAY FOUND AT " + found, "ok");
          refreshDeviceInfo();
        } else {
          setStatus("NO DISPLAY FOUND ON THIS NETWORK", "err");
        }
      } catch (err) {
        setStatus("SCAN FAILED", "err");
      }
      scan.disabled = false;
    });

    const fwBtn = document.getElementById("fwBtn");
    const devinfo = document.getElementById("devinfo");

    async function refreshDeviceInfo() {
      const target = host.value.trim();
      if (!target) return;
      const info = await window.ionity.deviceInfo(target);
      devinfo.textContent = info
        ? `DEVICE V${info.version} - ${info.verses} VERSES - OTA ${info.ota ? "READY" : "NO"}`
        : "DEVICE INFO UNAVAILABLE (V2 FIRMWARE HAS NO /id)";
    }

    fwBtn.addEventListener("click", async () => {
      const target = host.value.trim();
      if (!target) { setStatus("ENTER OR FIND THE DISPLAY ADDRESS", "err"); return; }
      setStatus("PICK A .BIN, THEN UPLOADING (SCREEN GOES DARK)...");
      fwBtn.disabled = true;
      try {
        const res = await window.ionity.pushFirmware(target);
        if (res.status === "staged") setStatus("STAGED - DEVICE IS INSTALLING AND REBOOTING", "ok");
        else if (res.status === "cancelled") setStatus("");
        else setStatus("DEVICE REJECTED THE IMAGE: " + (res.body || ""), "err");
      } catch (err) {
        setStatus("UPLOAD FAILED - IS THIS A V3 (OTA) DEVICE?", "err");
      }
      fwBtn.disabled = false;
    });

    window.ionity.localIps().then((ips) => {
      document.getElementById("myip").textContent = ips.length ? ips.join("  |  ") : "no network";
    });
    if (host.value) refreshDeviceInfo();
  </script>
</body>
</html>
